<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diamond Gallery</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:url("https://i.pinimg.com/originals/4f/2d/e6/4f2de68d3d767bc1b1ca97031181f0a6.jpg")
    no-repeat center/cover fixed;
}

.gallery{
    width:800px;
    height:650px;
    position:relative;
}


.box{
    position:absolute;
    width:220px;
    height:220px;
    overflow:hidden;
    border:6px solid #d8a04a;
    border-radius:10px;
    background:#fff;

    transform:rotate(45deg);
}


.box img{
    position:absolute;
    width:160%;
    height:160%;
    object-fit:cover;

    top:50%;
    left:50%;
    transform:translate(-50%,-50%) rotate(-45deg);
}

.center{
    width:280px;
    height:280px;
    top:185px;
    left:260px;
}

.top-left{
    top:20px;
    left:70px;
}

.top-right{
    top:20px;
    right:70px;
}

.bottom-left{
    bottom:20px;
    left:70px;
}

.bottom-right{
    bottom:20px;
    right:70px;
}
</style>
</head>

<body>

<div class="gallery">

    <div class="box top-left">
        <img src="https://plus.unsplash.com/premium_photo-1711434824963-ca894373272e?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0" alt="">
    </div>

    <div class="box top-right">
        <img src="https://thumbs.dreamstime.com/b/natural-scenery-765671.jpg" alt="">
    </div>

    <div class="box center">
        <img src="https://static.vecteezy.com/system/resources/thumbnails/049/546/770/small/stunning-high-resolution-nature-and-landscape-backgrounds-breathtaking-scenery-in-hd-free-photo.jpg" alt="">
    </div>

    <div class="box bottom-left">
        <img src="https://static.vecteezy.com/system/resources/thumbnails/026/717/034/small/nature-floral-background-in-early-summer-colorful-natural-spring-landscape-with-with-flowers-soft-selective-focus-generative-ai-illustration-free-photo.jpg" alt="">
    </div>

    <div class="box bottom-right">
        <img src="https://michiganross.umich.edu/sites/default/files/styles/max_325x325/public/images/news-story/butterfly.jpeg?itok=zndZsiuK" alt="">
    </div>

</div>

</body>
</html>
